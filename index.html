// ---------- auth ----------
async function boot(){await loadSettings();applyTheme();const s=await SB.auth.getSession();if(!s.data.session){loginView();return}await enter()}
async function enter(){const u=await SB.auth.getUser();if(!u.data.user){loginView();return}const p=await SB.from('profiles').select('*').eq('id',u.data.user.id).maybeSingle();if(!p.data){$('#app').innerHTML=`<div class="auth"><div class="aform" style="grid-column:1/-1"><div class="box"><h2>No access yet</h2><p class="mut">This account is not linked to a profile. Ask ${esc(S.set.agency_name)} to set up your access.</p><button class="btn" data-act="logout">Log out</button></div></div></div>`;return}S.profile=p.data;S.role=p.data.role;try{await loadAll()}catch(e){toast('Could not load data: '+e.message)}route()}
function loginView(){S.profile=null;$('#app').innerHTML=`<div class="auth"><div class="ahero"><div class="row">${logoHtml()}<b style="font-size:18px">${esc(S.set.agency_name)}</b></div><div><h1>${esc(S.set.tagline||'')}</h1><p>Your projects, reports and invoices in one place.</p></div><small style="color:#7dd3fc">Created by Hassan Ali</small></div><div class="aform"><div class="box"><h2>Welcome back</h2><p class="mut">Log in with your email and password.</p><div class="fld"><label>Email</label><input id="em" type="email" autocomplete="username"></div><div class="fld"><label>Password</label><input id="pw" type="password" autocomplete="current-password"></div><div class="err" id="er" role="alert"></div><button class="btn" style="width:100%;padding:11px" data-act="login">Log in</button></div></div></div>`;const p=$('#pw');if(p)p.onkeydown=e=>{if(e.key==='Enter')doLogin()}}
async function doLogin(){const er=$('#er');er.textContent='Checking...';const r=await SB.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(r.error){er.textContent=r.error.message==='Invalid login credentials'?'Wrong email or password.':r.error.message;return}await enter()}
async function logout(){await SB.auth.signOut();S.profile=null;S.D={};loginView()}
// ---------- router / shell ----------
function route(){const h=location.hash.replace(/^#\/?/,'')||'dashboard';const p=h.split('/');S.view=p[0];S.vid=p[1]||'';S.q='';render()}
window.addEventListener('hashchange',()=>{if(S.profile)route()});
function render(){if(!S.profile)return;const adm=S.role==='admin',items=adm?NAV_A:NAV_C;let nav='',g='';items.forEach(it=>{if(it.g&&it.g!==g){g=it.g;nav+=`<div class="ng">${it.g}</div>`}nav+=`<a href="#/${it.k}" class="${S.view===it.k||(S.view==='client'&&it.k==='clients')?'on':''}">${ic(it.i)}${it.l}</a>`});
$('#app').innerHTML=`<div class="shell"><aside id="side"><div class="brand">${logoHtml()}<b>${esc(S.set.agency_name)}<small>${esc(S.set.tagline||'')}</small></b></div>${nav}<div class="sp"></div><div class="who"><b>${esc(S.profile.full_name||S.profile.email||'')}</b><small>${adm?'Admin':'Client portal'}</small></div><button class="sbtn" data-act="theme">Light / dark</button><button class="sbtn" data-act="logout">Log out</button><div class="cr">Created by Hassan Ali</div></aside><main><div class="topbar"><button data-act="menu" aria-label="Menu">&#9776;</button><b>${esc(S.set.agency_name)}</b></div><div id="view">${viewHtml()}</div></main></div>`}
function viewHtml(){const v=S.view,adm=S.role==='admin';if(!adm){if(['projects','tasks','keywords','backlinks'].includes(v))return listView(v);if(v==='invoices')return invoicesView();if(v==='reports')return reportsView();return client360(S.profile.client_id,true)}
switch(v){case'leads':return board();case'client':return client360(S.vid,false);case'invoices':return invoicesView();case'reports':return reportsView();case'settings':return settingsView();case'dashboard':return dash();default:return E[v]?listView(v):dash()}}
const head=(t,p,btn)=>`<div class="head"><div><h2>${t}</h2><p>${p||''}</p></div><div class="row">${btn||''}</div></div>`;
const kpis=a=>`<div class="kpis">${a.map(k=>`<div class="kpi"><div class="n">${k[1]}</div><div class="l">${k[0]}</div></div>`).join('')}</div>`;
// ---------- tables ----------
function cell(r,c){const k=c[0],kind=c[2],o=c[3],v=r[k];if(kind==='money')return v==null?'':money(v);if(kind==='badge')return v?`<span class="bd ${bcls(v)}">${esc(v)}</span>`:'';if(kind==='ref')return esc(nm(o,v));if(kind==='date')return esc(String(v||'').slice(0,10));if(kind==='link')return v?`<a href="${esc(sUrl(v))}" target="_blank" rel="noopener noreferrer">${esc(v)}</a>`:'';return esc(v)}
function tableOf(rows,cols,act,ent,lateFn){if(!rows.length)return'<div class="empty">Nothing here yet.</div>';return`<div class="wrap"><table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="${lateFn&&lateFn(r)?'late':''}" data-act="${act}" data-e="${ent}" data-id="${r.id}">${cols.map(c=>`<td>${cell(r,c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
const colsFor=ent=>E[ent].cols.filter(c=>S.role==='admin'||!(c[2]==='ref'&&c[3]==='clients'));
const filt=ent=>{const s=S.q.toLowerCase();return(S.D[ent]||[]).filter(r=>!s||JSON.stringify(Object.values(r)).toLowerCase().includes(s))};
function tableHtml(v){if(v==='invoices')return invTable();if(v==='reports')return repTable();return tableOf(filt(v),colsFor(v),'row',v,v==='tasks'?r=>r.due_date&&r.due_date<today()&&r.status!=='Done':null)}
function listView(v){const e=E[v],adm=S.role==='admin';return head(e.label,`${(S.D[v]||[]).length} total`,(adm?`<button class="btn g" data-act="export" data-e="${v}">Export CSV</button><button class="btn" data-act="add" data-e="${v}">Add ${e.one}</button>`:''))+`<div class="tools"><input id="srch" placeholder="Search ${e.label.toLowerCase()}" value="${esc(S.q)}"></div><div id="tbl">${tableHtml(v)}</div>`}
document.addEventListener('input',e=>{if(e.target.id==='srch'){S.q=e.target.value;$('#tbl').innerHTML=tableHtml(S.view)}});
// ---------- dashboard ----------
function dash(){const D=S.D,t=today(),mon=t.slice(0,7);const act=D.clients.filter(c=>c.status==='Active').length,ap=D.projects.filter(p=>p.status==='Active').length,ol=D.leads.filter(l=>l.status!=='Won'&&l.status!=='Lost').length;
const rev=sum(D.payments.filter(p=>String(p.paid_on).slice(0,7)===mon)),pend=sum(D.invoices.filter(i=>i.status==='Sent'));
const late=D.tasks.filter(x=>x.status!=='Done'&&x.due_date&&x.due_date<=t).sort((a,b)=>a.due_date<b.due_date?-1:1).slice(0,6);
const dl=D.projects.filter(p=>p.status!=='Completed'&&p.deadline&&p.deadline>=t&&p.deadline<=new Date(Date.now()+14*864e5).toISOString().slice(0,10)).slice(0,6);
const fu=D.leads.filter(l=>l.next_followup&&l.next_followup<=t&&l.status!=='Won'&&l.status!=='Lost').slice(0,6);
const ms=[];for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const k=d.toISOString().slice(0,7);ms.push({k,l:d.toLocaleString('en-US',{month:'short'}),r:sum(D.payments.filter(p=>String(p.paid_on).slice(0,7)===k)),x:sum(D.expenses.filter(p=>String(p.expense_date).slice(0,7)===k))})}
const mx=Math.max(1,...ms.map(m=>Math.max(m.r,m.x)));
const mini=(h,rows,fn)=>`<div class="card mini"><h3>${h}</h3>${rows.length?rows.map(fn).join(''):'<div class="mut">All clear.</div>'}</div>`;
const li=(a,b,e,id)=>`<div class="row" style="justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer" data-act="row" data-e="${e}" data-id="${id}"><span>${esc(a)}</span><span class="mut">${esc(b)}</span></div>`;
return head('Dashboard',`Welcome back, ${esc((S.profile.full_name||'').split(' ')[0]||'Admin')}`)+kpis([['Active clients',act],['Active projects',ap],['Open leads',ol],['Revenue this month',money(rev)],['Pending invoices',money(pend)]])+
`<div class="card" style="margin-bottom:16px"><h3 style="margin-bottom:6px">Revenue vs expenses</h3><div class="bars">${ms.map(m=>`<div class="bg"><div class="bp"><i style="height:${Math.round(m.r/mx*125)}px;background:var(--acc)" title="Revenue ${money(m.r)}"></i><i style="height:${Math.round(m.x/mx*125)}px;background:var(--mut);opacity:.6" title="Expenses ${money(m.x)}"></i></div><small>${m.l}</small></div>`).join('')}</div><div class="leg"><span><i style="background:var(--acc)"></i>Revenue</span><span><i style="background:var(--mut)"></i>Expenses</span></div></div>`+
`<div class="cols">${mini('Tasks due or overdue',late,x=>li(x.title,x.due_date,'tasks',x.id))}${mini('Project deadlines (14 days)',dl,x=>li(x.name,x.deadline,'projects',x.id))}${mini('Leads to follow up',fu,x=>li(x.name,x.next_followup,'leads',x.id))}</div>`}
// ---------- client 360 / portal ----------
function client360(id,portal){const D=S.D,c=D.clients.find(x=>x.id===id);if(!c)return head('Overview','')+'<div class="card">No client account is linked yet.</div>';const by=t=>D[t].filter(x=>x.client_id===id);
const out=sum(by('invoices').filter(i=>i.status==='Sent'));const p=D.profiles.find(x=>x.client_id===id);
const mini=(h,rows,cols,ent,act)=>`<div class="mini"><h3>${h}</h3>${tableOf(rows.slice(0,6),cols,act||'row',ent)}</div>`;
const nc=ent=>E[ent].cols.filter(x=>!(x[2]==='ref'&&x[3]==='clients'));
return head(esc(c.business_name),`${esc(c.industry||'')} ${c.target_country?'· '+esc(c.target_country):''} ${c.contact_name?'· '+esc(c.contact_name):''}`,portal?'':`<button class="btn g" data-act="row" data-e="clients" data-id="${id}">Edit client</button>`)+
kpis([['Active projects',by('projects').filter(x=>x.status==='Active').length],['Keywords',by('keywords').length],['Backlinks',by('backlinks').length],['Outstanding',money(out)],['Reports',by('reports').length]])+
(portal?'':`<p class="mut">Portal login: <b>${p?esc(p.email):'not created yet'}</b></p>`)+
mini('Projects',by('projects'),nc('projects'),'projects')+mini('Open tasks',by('tasks').filter(x=>x.status!=='Done'),nc('tasks'),'tasks')+mini('Latest backlinks',by('backlinks'),nc('backlinks'),'backlinks')+mini('Invoices',by('invoices'),invCols,'invoices','inv')+mini('Reports',by('reports'),repCols,'reports','rep')}
// ---------- forms ----------
function refOpts(t,v,req,client){let rows=S.D[t]||[];if(client&&(t==='websites'||t==='projects'))rows=rows.filter(r=>r.client_id===client);return(req?'':'<option value=""></option>')+rows.map(r=>`<option value="${r.id}"${r.id===v?' selected':''}>${esc(LBL[t](r))}</option>`).join('')}
function fld(f,v,row){const k=f[0],l=f[1],t=f[2],o=f[3],req=f[4],id='f_'+k;let c;
if(t==='textarea')c=`<textarea id="${id}" rows="3">${esc(v)}</textarea>`;
else if(t==='select')c=`<select id="${id}">${(req?'':'<option value=""></option>')+o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')}</select>`;
else if(t==='ref')c=`<select id="${id}">${refOpts(o,v,req,row&&row.client_id)}</select>`;
else if(t==='bool')c=`<label class="chk"><input type="checkbox" id="${id}"${v?' checked':''}> ${esc(o)}</label>`;
else c=`<input id="${id}" type="${t}" ${t==='number'?'step="any" ':''}value="${esc(v)}">`;
return`<div class="fld${t==='textarea'?' wide':''}"><label for="${id}">${l}${req?' *':''}</label>${c}</div>`}
function modal(html,w){$('#modal').innerHTML=`<div class="ov" data-act="ovl"><div class="mbox${w?' w':''}">${html}</div></div>`}
const closeM=()=>{$('#modal').innerHTML='';S.m=null};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
function openForm(ent,row){const e=E[ent],isNew=!row;row=row||Object.assign({},e.def||{});S.m={ent,id:row.id};
modal(`<h3>${isNew?'Add':'Edit'} ${e.one}</h3><div class="grid2">${e.f.map(f=>fld(f,row[f[0]],row)).join('')}</div>${ent==='clients'&&!isNew?loginPanel(row):''}<div class="mbar"><button class="btn g" data-act="close">Cancel</button>${isNew?'':'<button class="btn d" data-act="del">Delete</button>'}<button class="btn" data-act="save">Save</button></div>`);
const cs=$('#f_client_id');if(cs)cs.onchange=()=>{['website_id','project_id'].forEach(k=>{const s=$('#f_'+k);if(s)s.innerHTML=refOpts(k==='website_id'?'websites':'projects','',false,cs.value)})}}
async function save(){const m=S.m,ent=m.ent,e=E[ent],o={};for(const f of e.f){const k=f[0],t=f[2],el=$('#f_'+k);let v=t==='bool'?el.checked:el.value.trim();if(t==='number')v=v===''?null:Number(v);else if(v==='')v=null;if(f[4]&&(v==null||v==='')){toast('Please fill: '+f[1]);return}o[k]=v}
const r=m.id?await SB.from(ent).update(o).eq('id',m.id).select().single():await SB.from(ent).insert(o).select().single();if(r.error){toast(r.error.message);return}
await loadAll([ent]);closeM();if(ent==='clients'&&!m.id){openForm('clients',r.data);toast('Client saved. You can create the portal login below.')}else toast('Saved');render()}
async function del(){const m=S.m,ent=m.ent;if(!confirm('Delete this '+E[ent].one+'? This cannot be undone.'))return;
if(ent==='clients'){const p=S.D.profiles.find(x=>x.client_id===m.id);if(p){const r=await fnCall({action:'delete_user',user_id:p.id});if(r.error){toast(r.error);return}}const fs=S.D.report_files.filter(f=>f.client_id===m.id);if(fs.length)await SB.storage.from('reports').remove(fs.map(f=>f.file_path))}
const r=await SB.from(ent).delete().eq('id',m.id);if(r.error){toast(r.error.message);return}await loadAll();closeM();toast('Deleted');if(ent==='clients'&&S.view==='client')location.hash='#/clients';render()}
function openRO(ent,id){const r=S.D[ent].find(x=>x.id===id);if(!r)return;const e=E[ent];const show=v=>v===true?'Yes':v===false?'No':esc(v||'');modal(`<h3>${esc(e.one[0].toUpperCase()+e.one.slice(1))}</h3><dl class="dl">${e.f.filter(f=>f[0]!=='client_id'&&f[0]!=='visible_to_client').map(f=>`<dt>${f[1]}</dt><dd>${f[2]==='ref'?esc(nm(f[3],r[f[0]])):show(r[f[0]])}</dd>`).join('')}</dl><div class="mbar"><button class="btn g" data-act="close">Close</button></div>`)}
// client portal login
const genPw=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789',b=crypto.getRandomValues(new Uint32Array(12));return Array.from(b,x=>a[x%a.length]).join('')};
function loginPanel(c){const p=S.D.profiles.find(x=>x.client_id===c.id);if(p)return`<div class="panel"><h4>Portal login</h4><p>Login email: <b>${esc(p.email)}</b></p><div class="row"><button class="btn g" data-act="resetpw" data-id="${p.id}">Reset password</button><button class="btn d" data-act="rmlogin" data-id="${p.id}">Remove login</button></div></div>`;
return`<div class="panel"><h4>Portal login</h4><p class="mut" style="margin-top:0">Give this client a login so they can see their projects, reports and invoices.</p><div class="grid2"><div class="fld"><label>Email</label><input id="lg_e" type="email" value="${esc(c.email||'')}"></div><div class="fld"><label>Password (8+ characters)</label><div class="row"><input id="lg_p" type="text" value="${genPw()}" style="flex:1"><button class="btn g" type="button" data-act="genpw">New</button></div></div></div><button class="btn" data-act="mklogin" data-id="${c.id}">Create login</button></div>`}
// ---------- leads board ----------
function board(){const L=S.D.leads;return head('Leads',`${L.length} leads. Drag a card to change its stage.`,`<button class="btn" data-act="add" data-e="leads">Add lead</button>`)+`<div class="kan">${LEAD.map(s=>{const c=L.filter(x=>x.status===s);return`<div class="kcol" data-st="${s}"><div class="kh"><b>${s}</b><span>${c.length}</span></div>${c.map(x=>`<div class="kc" draggable="true" data-id="${x.id}" data-act="row" data-e="leads"><b>${esc(x.name)}</b><span>${esc(x.company||'')}</span><div class="kf">${x.budget?money(x.budget):''}${x.next_followup?' · '+esc(x.next_followup):''}</div></div>`).join('')}</div>`}).join('')}</div>`}
document.addEventListener('dragstart',e=>{const k=e.target.closest&&e.target.closest('.kc');if(k)S.drag=k.dataset.id});
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('.kcol'))e.preventDefault()});
document.addEventListener('drop',async e=>{const col=e.target.closest&&e.target.closest('.kcol');if(!col||!S.drag)return;e.preventDefault();const id=S.drag;S.drag=null;const st=col.dataset.st,l=S.D.leads.find(x=>x.id===id);if(!l||l.status===st)return;const up={status:st};
if(st==='Won'&&!l.client_id&&confirm('Create a client from this lead?')){const r=await SB.from('clients').insert({business_name:l.company||l.name,contact_name:l.name,email:l.email,phone:l.phone}).select().single();if(r.error){toast(r.error.message);return}up.client_id=r.data.id;await loadAll(['clients'])}
const r=await SB.from('leads').update(up).eq('id',id);if(r.error){toast(r.error.message);return}await loadAll(['leads']);render()});
// ---------- invoices ----------
const invSt=i=>i.status==='Sent'&&i.due_date&&i.due_date<today()?'Overdue':i.status;
const invCols=[['invoice_no','Invoice'],['client_id','Client','ref','clients'],['issue_date','Issued','date'],['due_date','Due','date'],['amount','Amount','money'],['status','Status','badge']];
function invTable(){const s=S.q.toLowerCase();const rows=S.D.invoices.filter(i=>!s||JSON.stringify(Object.values(i)).toLowerCase().includes(s)).map(i=>Object.assign({},i,{status:invSt(i)}));const cols=S.role==='admin'?invCols:invCols.filter(c=>c[0]!=='client_id');return tableOf(rows,cols,'inv','invoices')}
function invoicesView(){const adm=S.role==='admin',I=S.D.invoices;return head('Invoices',`${I.length} invoices`,adm?'<button class="btn" data-act="newinv">New invoice</button>':'')+kpis([['Paid',money(sum(I.filter(i=>i.status==='Paid')))],['Outstanding',money(sum(I.filter(i=>i.status==='Sent')))],['Invoices',I.length]])+`<div class="tools"><input id="srch" placeholder="Search invoices" value="${esc(S.q)}"></div><div id="tbl">${invTable()}</div>`}
function nextInv(){const n=Math.max(0,...S.D.invoices.map(i=>parseInt((i.invoice_no.match(/(\d+)$/)||[0,0])[1],10)||0));return'INV-'+String(n+1).padStart(4,'0')}
const itemRow=(d,q,p)=>`<div class="itm"><input class="i_d" placeholder="Description" value="${esc(d)}"><input class="i_q" type="number" step="any" value="${q}"><input class="i_p" type="number" step="any" value="${p}"><button class="btn g" type="button" data-act="rmitem">&times;</button></div>`;
function calcTot(){let t=0;document.querySelectorAll('.itm').forEach(r=>{t+=(Number(r.querySelector('.i_q').value)||0)*(Number(r.querySelector('.i_p').value)||0)});const el=$('#itot');if(el)el.textContent=money(t);return t}
document.addEventListener('input',e=>{if(e.target.classList&&(e.target.classList.contains('i_q')||e.target.classList.contains('i_p')))calcTot()});
function invForm(id){const i=id?S.D.invoices.find(x=>x.id===id):{invoice_no:nextInv(),issue_date:today(),status:'Sent',items:[]};S.m={ent:'invoices',id};const items=(i.items&&i.items.length?i.items:[{d:'',q:1,p:0}]);
modal(`<h3>${id?'Edit':'New'} invoice</h3><div class="grid2"><div class="fld"><label>Client *</label><select id="v_c">${refOpts('clients',i.client_id,1)}</select></div><div class="fld"><label>Invoice number *</label><input id="v_n" value="${esc(i.invoice_no)}"></div><div class="fld"><label>Issue date</label><input id="v_i" type="date" value="${esc(i.issue_date||'')}"></div><div class="fld"><label>Due date</label><input id="v_d" type="date" value="${esc(i.due_date||'')}"></div><div class="fld"><label>Status</label><select id="v_s">${['Draft','Sent','Paid'].map(x=>`<option${x===i.status?' selected':''}>${x}</option>`).join('')}</select></div><div class="fld wide"><label>Items (description, quantity, price)</label><div id="items">${items.map(x=>itemRow(x.d,x.q,x.p)).join('')}</div><button class="btn g" type="button" data-act="additem" style="align-self:flex-start">Add item</button></div><div class="fld wide"><label>Notes</label><textarea id="v_o" rows="2">${esc(i.notes)}</textarea></div></div><div class="tot">Total: <span id="itot"></span></div><div class="mbar"><button class="btn g" data-act="close">Cancel</button>${id?'<button class="btn d" data-act="delinv">Delete</button>':''}<button class="btn" data-act="saveinv">Save invoice</button></div>`,1);calcTot()}
async function saveInv(){const id=S.m.id,items=[];document.querySelectorAll('.itm').forEach(r=>{const d=r.querySelector('.i_d').value.trim();if(d)items.push({d,q:Number(r.querySelector('.i_q').value)||0,p:Number(r.querySelector('.i_p').value)||0})});
const o={client_id:$('#v_c').value,invoice_no:$('#v_n').value.trim(),issue_date:$('#v_i').value||today(),due_date:$('#v_d').value||null,status:$('#v_s').value,notes:$('#v_o').value.trim()||null,items,amount:items.reduce((t,x)=>t+x.q*x.p,0)};
if(!o.client_id||!o.invoice_no||!items.length){toast('Pick a client, number and at least one item');return}
if(o.status==='Paid')o.paid_on=today();const r=id?await SB.from('invoices').update(o).eq('id',id).select().single():await SB.from('invoices').insert(o).select().single();if(r.error){toast(r.error.message.includes('duplicate')?'This invoice number already exists':r.error.message);return}
if(o.status==='Paid')await ensurePay(r.data);await loadAll(['invoices','payments']);closeM();toast('Invoice saved');render()}
async function ensurePay(inv){await loadAll(['payments']);const paid=sum(S.D.payments.filter(p=>p.invoice_id===inv.id)),left=Number(inv.amount)-paid;if(left>0)await SB.from('payments').insert({invoice_id:inv.id,client_id:inv.client_id,amount:left,paid_on:today(),method:'Recorded'})}
function openInvoice(id){const i=S.D.invoices.find(x=>x.id===id);if(!i)return;const c=S.D.clients.find(x=>x.id===i.client_id)||{},pays=S.D.payments.filter(p=>p.invoice_id===id),adm=S.role==='admin';S.m={ent:'invoices',id};
modal(`<div class="inv"><div class="row" style="justify-content:space-between;align-items:flex-start"><div class="row">${logoHtml()}<b style="font-size:18px">${esc(S.set.agency_name)}</b></div><div style="text-align:right"><h3 style="margin:0">Invoice ${esc(i.invoice_no)}</h3><span class="bd ${bcls(invSt(i))}">${esc(invSt(i))}</span></div></div><p><b>Bill to:</b> ${esc(c.business_name||'')}${c.email?'<br>'+esc(c.email):''}<br><span class="mut">Issued ${esc(i.issue_date||'')}${i.due_date?' · Due '+esc(i.due_date):''}</span></p><table><thead><tr><th>Description</th><th>Qty</th><th>Price</th><th>Amount</th></tr></thead><tbody>${(i.items||[]).map(x=>`<tr style="cursor:default"><td>${esc(x.d)}</td><td>${esc(x.q)}</td><td>${money(x.p)}</td><td>${money(x.q*x.p)}</td></tr>`).join('')}</tbody></table><div class="tot">Total: ${money(i.amount)}</div>${pays.length?`<p class="mut">Payments: ${pays.map(p=>money(p.amount)+' on '+esc(p.paid_on)).join(', ')}</p>`:''}${i.notes?`<p>${esc(i.notes)}</p>`:''}</div><div class="mbar"><button class="btn g" data-act="close">Close</button><button class="btn g" data-act="print">Print</button>${adm?`${i.status!=='Paid'?'<button class="btn" data-act="markpaid">Mark as paid</button>':''}<button class="btn" data-act="editinv">Edit</button>`:''}</div>`,1)}
// ---------- reports ----------
const repCols=[['title','Report'],['client_id','Client','ref','clients'],['period','Period'],['visible_to_client','Visible to client','bool'],['created_at','Created','date']];
function repTable(){const s=S.q.toLowerCase();const rows=S.D.reports.filter(r=>!s||JSON.stringify(Object.values(r)).toLowerCase().includes(s));const cols=S.role==='admin'?repCols:repCols.filter(c=>c[0]!=='client_id'&&c[0]!=='visible_to_client');return tableOf(rows,cols,'rep','reports')}
function reportsView(){const adm=S.role==='admin';return head('Reports',`${S.D.reports.length} reports`,adm?'<button class="btn" data-act="newrep">New report</button>':'')+`<div class="tools"><input id="srch" placeholder="Search reports" value="${esc(S.q)}"></div><div id="tbl">${repTable()}</div>`}
const fsize=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
function filesHtml(id,adm){const fs=S.D.report_files.filter(f=>f.report_id===id);return fs.length?fs.map(f=>`<div class="row" style="justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)"><span>${esc(f.file_name)} <span class="mut">${f.size?fsize(f.size):''}</span></span><span class="row"><button class="btn g" data-act="dl" data-path="${esc(f.file_path)}">Download</button>${adm?`<button class="btn d" data-act="rmfile" data-id="${f.id}">Remove</button>`:''}</span></div>`).join(''):'<p class="mut">No files yet.</p>'}
function repForm(id){const r=id?S.D.reports.find(x=>x.id===id):{visible_to_client:true};S.m={ent:'reports',id};
modal(`<h3>${id?'Edit':'New'} report</h3><div class="grid2"><div class="fld"><label>Client *</label><select id="r_c">${refOpts('clients',r.client_id,1)}</select></div><div class="fld"><label>Period</label><input id="r_p" placeholder="November 2026" value="${esc(r.period)}"></div><div class="fld wide"><label>Title *</label><input id="r_t" value="${esc(r.title)}"></div><div class="fld wide"><label>Summary</label><textarea id="r_s" rows="4">${esc(r.summary)}</textarea></div><div class="fld wide"><label class="chk"><input type="checkbox" id="r_v"${r.visible_to_client?' checked':''}> Visible to the client in their portal</label></div><div class="fld wide"><label>Upload files (PDF, Excel, images, anything up to 50 MB each)</label><input id="r_f" type="file" multiple></div></div><div id="rfiles">${id?`<h4 style="margin-top:12px">Files</h4>${filesHtml(id,true)}`:''}</div><div class="mbar"><button class="btn g" data-act="close">Cancel</button>${id?'<button class="btn d" data-act="delrep">Delete</button>':''}<button class="btn" data-act="saverep">Save report</button></div>`,1)}
async function saveRep(){const id=S.m.id,o={client_id:$('#r_c').value,title:$('#r_t').value.trim(),period:$('#r_p').value.trim()||null,summary:$('#r_s').value.trim()||null,visible_to_client:$('#r_v').checked};if(!o.client_id||!o.title){toast('Pick a client and add a title');return}
const files=Array.from($('#r_f').files||[]);const r=id?await SB.from('reports').update(o).eq('id',id).select().single():await SB.from('reports').insert(o).select().single();if(r.error){toast(r.error.message);return}
let n=0;for(const f of files){toast('Uploading '+f.name+'...');const safe=f.name.replace(/[^\w.\-]+/g,'_'),path=`${r.data.client_id}/${r.data.id}/${Date.now()}-${safe}`;const u=await SB.storage.from('reports').upload(path,f,{contentType:f.type||undefined});if(u.error){toast('Upload failed: '+u.error.message);continue}await SB.from('report_files').insert({report_id:r.data.id,client_id:r.data.client_id,file_path:path,file_name:f.name,size:f.size});n++}
await loadAll(['reports','report_files']);closeM();toast(n?`Report saved with ${n} file${n>1?'s':''}`:'Report saved');render()}
function openReport(id){if(S.role==='admin'){repForm(id);return}const r=S.D.reports.find(x=>x.id===id);if(!r)return;modal(`<h3>${esc(r.title)}</h3><p class="mut">${esc(r.period||'')}</p><p>${esc(r.summary||'')}</p><h4>Files</h4>${filesHtml(id,false)}<div class="mbar"><button class="btn g" data-act="close">Close</button></div>`)}
// ---------- settings ----------
function settingsView(){const s=S.set;return head('Settings','Make the CRM your own. Changes apply to everyone.')+`<div class="card" style="max-width:640px"><div class="grid2"><div class="fld"><label>Agency name</label><input id="s_n" value="${esc(s.agency_name)}"></div><div class="fld"><label>Tagline</label><input id="s_t" value="${esc(s.tagline)}"></div><div class="fld"><label>Main colour</label><input id="s_p" type="color" value="${esc(s.primary_color)}"></div><div class="fld"><label>Accent colour</label><input id="s_a" type="color" value="${esc(s.accent_color)}"></div><div class="fld"><label>Currency</label><select id="s_c">${['USD','GBP','EUR','AED','PKR','CAD','AUD'].map(x=>`<option${x===s.currency?' selected':''}>${x}</option>`).join('')}</select></div><div class="fld"><label>Logo (optional image)</label><input id="s_l" type="file" accept="image/*"></div></div><div class="mbar"><button class="btn" data-act="savesettings">Save settings</button></div></div><div class="card" style="max-width:640px;margin-top:16px"><h3 style="margin-bottom:10px">Change my password</h3><div class="row"><input id="s_pw" type="password" placeholder="New password (8+ characters)" style="flex:1" autocomplete="new-password"><button class="btn" data-act="chpw">Change</button></div></div>`}
function shrink(file){return new Promise(res=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/png'))};im.onerror=()=>res(null);im.src=u})}
async function saveSettings(){const o={agency_name:$('#s_n').value.trim()||'Agency',tagline:$('#s_t').value.trim(),primary_color:$('#s_p').value,accent_color:$('#s_a').value,currency:$('#s_c').value};const f=$('#s_l').files[0];if(f){const d=await shrink(f);if(d)o.logo_url=d}
const r=await SB.from('settings').update(o).eq('id',1);if(r.error){toast(r.error.message);return}Object.assign(S.set,o);applyTheme();toast('Settings saved');render()}
// ---------- CSV ----------
function exportCsv(ent){const keys=E[ent].f.map(f=>f[0]);const rows=S.D[ent].map(r=>keys.map(k=>'"'+String(r[k]==null?'':r[k]).replace(/"/g,'""')+'"').join(','));const b=new Blob([[keys.join(',')].concat(rows).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=ent+'.csv';a.click()}
// ---------- clicks ----------
document.addEventListener('click',async e=>{const t=e.target.closest('[data-act]');if(!t||e.target.closest('a'))return;const a=t.dataset.act,en=t.dataset.e,id=t.dataset.id;
if(a==='ovl'){if(e.target===t)closeM();return}
if(a==='login')return doLogin();if(a==='logout')return logout();if(a==='close')return closeM();
if(a==='theme'){localStorage.setItem('se_theme',document.documentElement.dataset.theme==='dark'?'light':'dark');return applyTheme()}
if(a==='menu')return $('#side').classList.toggle('open');
if(a==='add')return openForm(en);
if(a==='row'){if(en==='clients'&&S.view!=='client'&&S.role==='admin'){location.hash='#/client/'+id;return}if(S.role==='admin')return openForm(en,S.D[en].find(x=>x.id===id));return openRO(en,id)}
if(a==='export')return exportCsv(en);
if(a==='save')return save();if(a==='del')return del();
if(a==='genpw'){$('#lg_p').value=genPw();return}
if(a==='mklogin'){const c=S.D.clients.find(x=>x.id===id),r=await fnCall({action:'create_client',client_id:id,email:$('#lg_e').value,password:$('#lg_p').value,full_name:c.contact_name||c.business_name});if(r.error){toast(r.error);return}toast('Login created. Share the email and password with your client.');await loadAll(['profiles']);return openForm('clients',c)}
if(a==='resetpw'){const p=prompt('New password for this client (8+ characters):');if(!p)return;const r=await fnCall({action:'reset_password',user_id:id,password:p});return toast(r.error||'Password changed. Share it with your client.')}
if(a==='rmlogin'){if(!confirm('Remove this client login? They will no longer be able to log in.'))return;const r=await fnCall({action:'delete_user',user_id:id});if(r.error){toast(r.error);return}await loadAll(['profiles']);const c=S.D.clients.find(x=>x.id===S.m.id);toast('Login removed');return openForm('clients',c)}
if(a==='newinv')return invForm();if(a==='inv')return openInvoice(id);if(a==='editinv')return invForm(S.m.id);
if(a==='additem'){$('#items').insertAdjacentHTML('beforeend',itemRow('',1,0));return}
if(a==='rmitem'){t.closest('.itm').remove();return calcTot()}
if(a==='saveinv')return saveInv();
if(a==='delinv'||(a==='delrep')){const ent=a==='delinv'?'invoices':'reports';if(!confirm('Delete this? This cannot be undone.'))return;if(ent==='reports'){const fs=S.D.report_files.filter(f=>f.report_id===S.m.id);if(fs.length)await SB.storage.from('reports').remove(fs.map(f=>f.file_path))}const r=await SB.from(ent).delete().eq('id',S.m.id);if(r.error){toast(r.error.message);return}await loadAll();closeM();toast('Deleted');return render()}
if(a==='markpaid'){const i=S.D.invoices.find(x=>x.id===S.m.id);const r=await SB.from('invoices').update({status:'Paid',paid_on:today()}).eq('id',i.id);if(r.error){toast(r.error.message);return}await ensurePay(i);await loadAll(['invoices','payments']);closeM();toast('Marked as paid');return render()}
if(a==='print')return window.print();
if(a==='newrep')return repForm();if(a==='rep')return openReport(id);if(a==='saverep')return saveRep();
if(a==='dl'){const r=await SB.storage.from('reports').createSignedUrl(t.dataset.path,120);if(r.error){toast(r.error.message);return}window.open(r.data.signedUrl,'_blank');return}
if(a==='rmfile'){if(!confirm('Remove this file?'))return;const f=S.D.report_files.find(x=>x.id===id);await SB.storage.from('reports').remove([f.file_path]);await SB.from('report_files').delete().eq('id',id);await loadAll(['report_files']);$('#rfiles').innerHTML=`<h4 style="margin-top:12px">Files</h4>${filesHtml(S.m.id,true)}`;return}
if(a==='savesettings')return saveSettings();
if(a==='chpw'){const p=$('#s_pw').value;if(p.length<8){toast('Use at least 8 characters');return}const r=await SB.auth.updateUser({password:p});toast(r.error?r.error.message:'Password changed');if(!r.error)$('#s_pw').value='';return}});
boot();

</script>
</body>
</html>
