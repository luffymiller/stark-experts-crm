function cell(r,c){const k=c[0],kind=c[2],o=c[3],v=r[k];if(kind==='rank'){const L=rankLogs(r.id);if(v==null)return'';let d='';if(L.length>1){const ch=L[L.length-2].rank-L[L.length-1].rank;d=ch>0?` <span class="up">&#9650;${ch}</span>`:ch<0?` <span class="dn">&#9660;${-ch}</span>`:''}return esc(v)+d}if(kind==='check')return S.role==='admin'?`<input type="checkbox" data-act="toggle" data-id="${r.id}" ${v==='Done'?'checked':''} aria-label="Done">`:'';if(kind==='money2')return v==null?'':money2(v,curOf(r));if(kind==='money')return v==null?'':money(v,curOf(r));if(kind==='badge')return v?`<span class="bd ${bcls(v)}">${esc(v)}</span>`:'';if(kind==='ref')return esc(nm(o,v));if(kind==='date')return esc(String(v||'').slice(0,10));if(kind==='link')return v?`<a href="${esc(sUrl(v))}" target="_blank" rel="noopener noreferrer">${esc(v)}</a>`:'';return esc(v)}

function dash(){const D=S.D,t=today(),mon=t.slice(0,7);const act=D.clients.filter(c=>c.status==='Active').length,ap=D.projects.filter(p=>p.status==='Active').length,ol=D.leads.filter(l=>l.status!=='Won'&&l.status!=='Lost').length;
const rev=mix(D.payments.filter(p=>String(p.paid_on).slice(0,7)===mon),'amount',curOf),pend=mix(D.invoices.filter(i=>i.status==='Sent'),'amount',curOf);

function parseCsv(t){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()!==''))rows.push(r);r=[]}else c+=ch}r.push(c);if(r.some(x=>x.trim()!==''))rows.push(r);return rows}

function shrink(file){return new Promise(res=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/png'))};im.onerror=()=>res(null);im.src=u})}
